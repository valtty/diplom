{% extends 'main/base.html' %}
{% load static %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<div class="fn-container">
    <section class="fn-section">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="fn-card">
                <div class="fn-card__body">
                    <h1 class="fn-title" style="font-size:40px;">Редактирование профиля</h1>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="first_name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="last_name" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="avatar" class="form-label">Аватар</label>
                            <input type="file" class="form-control" id="avatar" name="avatar">
                            {% if user.avatar %}
                                <img src="{{ user.avatar.url }}" class="mt-2 fn-card" style="max-height: 120px; border-radius: var(--fn-radius-sm); box-shadow:none;">
                            {% endif %}
                        </div>
                        
                        <div class="d-grid d-md-flex gap-2 flex-wrap">
                            <button type="submit" class="fn-btn fn-btn--hero-primary fn-btn--page-sm">Сохранить</button>
                            <a href="{% url 'users:profile' %}" class="fn-btn fn-btn--hero-outline fn-btn--page-sm">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </section>
</div>
{% endblock %}
